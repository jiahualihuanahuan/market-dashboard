services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  updater:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://market:market@db:5432/market
    command: python update_daily.py

volumes:
  pgdata:
